<body>
<main class="album">
  <a class="btn alt sm" id="back" href="index.html">← សំបុត្រអញ្ជើញ</a>
  <h1>អាល់ប៊ុមរូបភាព</h1>
  <div class="orn"></div>
  <p class="sub" id="sub">Guest Album</p>
  <div class="tabs" role="group" aria-label="Choose album">
    <button type="button" id="tGroom" data-side="groom">ខាងកូនកំលោះ · Groom <small></small></button>
    <button type="button" id="tBride" data-side="bride">ខាងកូនក្រមុំ · Bride <small></small></button>
  </div>
  <p><a class="btn" id="up" target="_blank" rel="noopener" hidden>📤 ផ្ញើរូបភាពរបស់អ្នក · Upload your photos</a></p>
  <div class="agrid" id="agrid"></div>
  <p class="hint" id="empty" hidden>រូបភាពនឹងត្រូវបានបន្ថែមក្រោយពិធី · Photos will be added after the wedding.</p>
</main>
<footer>សូមអរគុណ · Thank you ♥</footer>

<div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden><button id="lbx" type="button" aria-label="Close photo viewer">✕</button><button id="lbp" type="button" aria-label="Previous photo">‹</button><img id="lbi" alt=""><button id="lbn" type="button" aria-label="Next photo">›</button><a id="lbd" class="btn sm" download>⬇ ទាញយក · Save</a></div>
