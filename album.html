<!-- STYLES -->
<style>
:root{--ink:#14110A;--gold:#C9A63A;--ivory:#F3EBD8;--wine:#7A1F2B;--muted:#b9ae98;--line:#c9a63a55;--card:#211c11;--header-height:60px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html,body{min-height:100dvh;margin:0;background:var(--ink);color:var(--ivory)}
body{font-family:'Noto Sans Khmer','Battambang',sans-serif;line-height:1.6;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 20%,#3b2d1018,transparent 58%),radial-gradient(ellipse at 50% 110%,#7a1f2b18,transparent 52%)}
button,a{font:inherit}
button{color:inherit}
/* CENTER-PINCH WIPE UTILITY: shared by primary, tab, chip, sheet, and lightbox controls. */
.wipe-fill{--wipe-ease:cubic-bezier(.4,0,.2,1);--wipe-duration:450ms;--wipe-fill:var(--gold);--wipe-base:#c9a63a14;--wipe-text-rest:#1a1405;--wipe-text-hover:#E9CF7A;position:relative;isolation:isolate;overflow:hidden;background:var(--wipe-base);color:var(--wipe-text-rest);transition:color var(--wipe-duration) var(--wipe-ease)}
.wipe-fill:before{content:"";position:absolute;inset:0;z-index:-1;background:var(--wipe-fill);clip-path:inset(0 0 0 0 round 999px);transition:clip-path var(--wipe-duration) var(--wipe-ease)}
.wipe-fill>*{position:relative;z-index:1}
.wipe-fill--inverse{--wipe-text-rest:var(--gold);--wipe-text-hover:#1a1405}.wipe-fill--inverse:before{clip-path:inset(0 50% 0 50% round 999px)}
@media (hover:hover){.wipe-fill:not([aria-pressed="true"]):not([aria-selected="true"]):hover{color:var(--wipe-text-hover)}.wipe-fill:not([aria-pressed="true"]):not([aria-selected="true"]):hover:before{clip-path:inset(0 50% 0 50% round 999px)}.wipe-fill--inverse:not([aria-pressed="true"]):not([aria-selected="true"]):hover{color:var(--wipe-text-hover)}.wipe-fill--inverse:not([aria-pressed="true"]):not([aria-selected="true"]):hover:before{clip-path:inset(0 0 0 0 round 999px)}}
.wipe-fill:focus-visible{color:var(--wipe-text-hover);outline:2px solid var(--gold);outline-offset:2px}.wipe-fill:focus-visible:before{clip-path:inset(0 50% 0 50% round 999px)}.wipe-fill--inverse:focus-visible{color:var(--wipe-text-hover)}.wipe-fill--inverse:focus-visible:before{clip-path:inset(0 0 0 0 round 999px)}
.wipe-fill[aria-pressed="true"],.wipe-fill[aria-selected="true"]{background:var(--gold);color:var(--wipe-text-rest)}.wipe-fill[aria-pressed="true"]:before,.wipe-fill[aria-selected="true"]:before{clip-path:inset(0 0 0 0 round 999px)}.wipe-fill:active{filter:brightness(.92)}
@media (prefers-reduced-motion:reduce){.wipe-fill,.wipe-fill:before{transition-duration:1ms}}
.site-header{position:sticky;top:0;z-index:30;min-height:var(--header-height);padding:calc(8px + var(--safe-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#14110Aee;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.back-link{justify-self:start;display:inline-flex;align-items:center;min-height:44px;padding:7px 12px;color:var(--gold);border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:.78rem;white-space:nowrap}
.back-link:hover,.back-link:focus-visible{border-color:var(--gold);color:var(--ivory)}
.header-title{grid-column:2;margin:0;color:var(--gold);font:400 1rem/1.3 'Moul','Noto Sans Khmer',sans-serif;text-align:center;white-space:nowrap}
.language-toggle{justify-self:end;display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:999px;background:#1e180d}.language-toggle button{min-height:32px;padding:4px 8px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:.65rem;white-space:nowrap;cursor:pointer}.language-toggle button[aria-pressed="true"]{background:var(--gold);color:var(--ink);font-weight:700}.language-toggle button:focus-visible,.sheet-close:focus-visible,.group-picker:focus-visible,.sheet-option:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.page{width:min(1100px,100%);margin:0 auto;padding:30px 16px calc(58px + var(--safe-bottom))}
.hero{text-align:center;padding:18px 0 28px}
.hero-kicker{margin:0;color:var(--gold);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.hero h1{margin:8px 0 0;font:400 clamp(1.45rem,5vw,2.2rem)/1.45 'Moul','Noto Sans Khmer',sans-serif;color:var(--ivory)}
.names{margin:7px 0 8px;font:italic 600 clamp(1.5rem,5vw,2.5rem)/1.05 'Cormorant Garamond',Georgia,serif;color:var(--gold)}
.hero-count{margin:0;color:var(--muted);font-size:.82rem}
.rule{width:min(180px,45%);height:1px;margin:18px auto 0;background:var(--gold)}
.control-deck{position:sticky;top:calc(var(--header-height,60px) + var(--safe-top));z-index:20;margin:0 -16px;padding:10px 16px 12px;background:#14110Aee;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.segmented{position:relative;display:grid;grid-template-columns:1fr 1fr;width:min(440px,100%);min-height:52px;margin:0 auto 12px;padding:4px;border:1px solid var(--line);border-radius:999px;background:#1e180d;isolation:isolate}
.seg-indicator{position:absolute;z-index:-1;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--gold);transition:transform .25s ease}
.segmented[data-side="bride"] .seg-indicator{transform:translateX(100%)}
.segmented button{min-height:44px;border:0;border-radius:999px;background:transparent;color:var(--gold);font-size:.78rem;cursor:pointer;transition:color .25s ease}
.segmented button[aria-pressed="true"]{color:var(--ink);font-weight:700}
.categories-wrap{max-width:900px;margin:0 auto;overflow:hidden}
.categories{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 12px;max-height:116px;overflow:hidden;padding:0}
.category-chip{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"kh count" "en count";align-items:center;column-gap:12px;flex:0 1 auto;min-width:145px;min-height:48px;padding:10px 16px;border:1px solid #c9a63a59;border-radius:14px;background:transparent;color:var(--ivory);cursor:pointer;text-align:left;transition:background .25s ease,border-color .25s ease,color .25s ease,box-shadow .25s ease,transform .25s ease}
.category-km{grid-area:kh;font:500 15px/1.35 'Noto Sans Khmer','Battambang',sans-serif;white-space:nowrap}.category-en{grid-area:en;color:var(--ivory);font:500 11px/1.2 'Cormorant Garamond','Noto Sans Khmer',serif;opacity:.6;white-space:nowrap}.category-chip small{grid-area:count;align-self:center;padding:2px 7px;border-radius:999px;background:#c9a63a2b;color:var(--gold);font:600 .85rem/1.3 'Cormorant Garamond',Georgia,serif}
.category-chip:hover,.category-chip:focus-visible{border-color:#c9a63ab3;transform:translateY(-1px)}
.category-chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink);box-shadow:0 0 20px #c9a63a35}.category-chip[aria-pressed="true"] .category-en{color:var(--ink);opacity:.7}.category-chip[aria-pressed="true"] small{background:#14110a33;color:var(--ink)}
.group-picker{display:none;width:100%;min-height:64px;padding:8px 14px;border:1px solid #c9a63a59;border-radius:14px;background:var(--card);color:var(--ivory);text-align:left;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"label chevron" "value chevron";align-items:center;gap:2px 10px;cursor:pointer}.group-picker-label{grid-area:label;min-width:0;overflow:hidden;color:var(--muted);font-size:.68rem;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}.group-picker strong{grid-area:value;min-width:0;overflow-wrap:anywhere;color:var(--gold);font-size:.8rem;font-weight:500;line-height:1.3}.group-picker-chevron{grid-area:chevron;color:var(--gold);font-size:1.2rem}
.sheet-backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;background:#0009;opacity:0;transition:opacity .2s ease}.sheet-backdrop.is-open{opacity:1}.sheet-backdrop[hidden]{display:none}.group-sheet{width:100%;max-height:min(80dvh,640px);padding:10px 16px calc(16px + var(--safe-bottom));border-top:1px solid var(--line);border-radius:20px 20px 0 0;background:#211c11;transform:translateY(100%);transition:transform .25s ease}.sheet-backdrop.is-open .group-sheet{transform:none}.sheet-handle{width:42px;height:4px;margin:0 auto 12px;border-radius:999px;background:var(--gold)}.sheet-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}.sheet-heading h2{margin:0;color:var(--ivory);font:500 1rem/1.4 'Noto Sans Khmer','Battambang',sans-serif}.sheet-close{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--gold);cursor:pointer}.sheet-options{overflow:auto;padding-top:6px}.sheet-option{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 4px;border:0;border-bottom:1px solid #c9a63a26;background:transparent;color:var(--ivory);text-align:left;cursor:pointer}.sheet-option .sheet-km{font-size:.9rem}.sheet-option .sheet-en{color:var(--muted);font:500 .9rem 'Cormorant Garamond','Noto Sans Khmer',serif}.sheet-option small{color:var(--gold);font:600 .95rem 'Cormorant Garamond',Georgia,serif}.sheet-option .check{width:22px;color:var(--gold);font-size:1.1rem;opacity:0}.sheet-option[aria-selected="true"] .check{opacity:1}
.gallery-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px;color:var(--muted);font-size:.78rem}
.gallery-meta strong{color:var(--ivory);font-weight:500}
.photo-grid{columns:2 160px;column-gap:10px}
.photo-card{display:block;position:relative;width:100%;margin:0 0 10px;padding:0;overflow:hidden;break-inside:avoid;border:2px solid transparent;border-radius:14px;background:#211c11;cursor:pointer;text-align:left;opacity:0;transform:translateY(12px);transition:opacity .55s ease var(--delay),transform .55s ease var(--delay),border-color .25s ease,box-shadow .25s ease}
.photo-card.is-ready{opacity:1;transform:none}
/* PHOTO CARD WIPE CSS: paste these rules inside the page's STYLES section. */
.photo-card:before{content:"";position:absolute;z-index:1;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(90,20,32,.94),rgba(200,32,58,.88));transform:scaleX(0);transform-origin:right;transition:transform 550ms cubic-bezier(.77,0,.18,1)}
.photo-caption{position:absolute;z-index:2;right:12px;bottom:12px;left:12px;display:flex;align-items:center;gap:10px;color:var(--ivory);opacity:0;transform:translateY(12px);transition:opacity 250ms ease 180ms,transform 250ms ease 180ms;pointer-events:none}
.photo-caption .heart{display:grid;flex:0 0 36px;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ivory);color:var(--wine);font-size:1.15rem;line-height:1}
.photo-caption .caption-kh{display:block;font:700 15px/1.35 'Noto Sans Khmer','Battambang',sans-serif}.photo-caption .caption-en{display:block;font:500 12px/1.25 'Cormorant Garamond','Noto Sans Khmer',serif;opacity:.8}
.photo-card:hover,.photo-card:focus-visible,.photo-card.on{border-color:var(--gold);box-shadow:0 0 26px #c9a63a4d;transform:translateY(-4px)}
.photo-card:hover:before,.photo-card:focus-visible:before,.photo-card.on:before{transform:scaleX(1);transform-origin:left}
.photo-card:hover .photo-caption,.photo-card:focus-visible .photo-caption,.photo-card.on .photo-caption{opacity:1;transform:translateY(0)}
.photo-card img{display:block;width:100%;height:auto;min-height:80px;background:linear-gradient(110deg,#211c11 8%,#332a18 18%,#211c11 33%);background-size:200% 100%;animation:shimmer 1.5s linear infinite;filter:blur(14px) saturate(.9);opacity:.65;transition:filter .55s ease,opacity .55s ease,transform 800ms ease}
.photo-card:hover img,.photo-card:focus-visible img,.photo-card.on img{filter:blur(0) saturate(1.08);transform:scale(1.07)}
.photo-card img.is-loaded{filter:blur(0);opacity:1;animation:none}
.photo-card.is-sample{cursor:default}
.photo-card.is-sample:before,.photo-card.is-sample .photo-caption{display:none}
.photo-card.is-sample img,.photo-card.is-sample img.is-loaded,.photo-card.is-sample:hover img,.photo-card.is-sample:focus-visible img{filter:blur(2px) brightness(.8);transform:none}
.sample-overlay{position:absolute;z-index:2;inset:0;display:grid;place-items:center;background:rgba(26,22,8,.55);pointer-events:none}
.coming-soon-badge{position:relative;display:flex;flex-direction:column;align-items:center;max-width:90%;overflow:hidden;padding:7px 22px 7px 12px;border:1px solid #C9A93F;border-radius:999px;background:rgba(201,169,63,.16);color:#E8D48B;text-align:center;box-shadow:0 0 16px rgba(201,169,63,.22);animation:sampleBadgeFade .3s ease both}
.coming-soon-badge:after{content:"";position:absolute;inset:-20% auto -20% 0;width:38%;background:linear-gradient(90deg,transparent,rgba(232,212,139,.24),transparent);transform:translateX(-140%);animation:sampleBadgeShimmer 4s ease-in-out infinite;pointer-events:none}
.coming-soon-kh{font:500 13px/1.35 'Noto Sans Khmer','Battambang',sans-serif;white-space:nowrap}
.coming-soon-en{font:600 10px/1.2 'Cormorant Garamond',Georgia,serif;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.coming-soon-icon{position:absolute;top:50%;right:8px;z-index:1;color:#E8D48B;font-size:10px;line-height:1;transform:translateY(-50%)}
@keyframes sampleBadgeFade{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes sampleBadgeShimmer{0%,12%{transform:translateX(-140%)}48%,100%{transform:translateX(360%)}}
@keyframes shimmer{to{background-position:-200% 0}}
.empty-state{margin:44px auto;text-align:center;color:var(--muted);font-size:.85rem}
.site-footer{padding:0 16px 28px;text-align:center;color:var(--muted);font-size:.75rem}
.lightbox{position:fixed;inset:0;z-index:60;display:grid;grid-template-rows:auto 1fr auto;padding:calc(12px + var(--safe-top)) max(16px,env(safe-area-inset-right)) calc(14px + var(--safe-bottom)) max(16px,env(safe-area-inset-left));background:#000000eb;backdrop-filter:blur(16px);opacity:0;transition:opacity .2s ease}
.lightbox.is-open{opacity:1}
.lightbox[hidden]{display:none}
.lightbox-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lightbox-spacer{width:44px;height:44px}
.lightbox-action{display:inline-grid;place-items:center;min-width:44px;min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#211c11;color:var(--ivory);text-decoration:none;cursor:pointer}
.lightbox-action:hover,.lightbox-action:focus-visible{border-color:var(--gold);color:var(--gold)}
.lightbox-counter{color:var(--gold);font:600 1rem 'Cormorant Garamond',Georgia,serif}
.lightbox-stage{position:relative;display:grid;place-items:center;min-height:0;overflow:hidden}
.lightbox-image{max-width:calc(100vw - 32px);max-height:calc(100dvh - 150px);width:auto;height:auto;object-fit:contain;touch-action:none;user-select:none;border-radius:10px;box-shadow:0 16px 60px #0008;background:linear-gradient(110deg,#211c11 8%,#332a18 18%,#211c11 33%);background-size:200% 100%;filter:blur(16px);opacity:.65;transition:transform .25s ease,filter .25s ease,opacity .25s ease}
.lightbox-image.is-loaded{filter:blur(0);opacity:1;background:none}
.lightbox-image.slide-left{animation:slideLeft .25s ease-out}.lightbox-image.slide-right{animation:slideRight .25s ease-out}
@keyframes slideLeft{from{opacity:.35;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideRight{from{opacity:.35;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
@keyframes flipIn{from{opacity:.5;transform:translate(var(--flip-x),var(--flip-y)) scale(var(--flip-sx),var(--flip-sy))}to{opacity:1;transform:translate(0,0) scale(1,1)}}
@keyframes rubberLeft{50%{transform:translateX(-16px)}}
@keyframes rubberRight{50%{transform:translateX(16px)}}
.lightbox-image.flip-in{animation:flipIn .42s cubic-bezier(.2,.8,.2,1)}
.lightbox-stage.rubber-left{animation:rubberLeft .22s ease-out}.lightbox-stage.rubber-right{animation:rubberRight .22s ease-out}
.lightbox-nav{position:absolute;top:50%;display:grid;place-items:center;width:48px;height:48px;border:1px solid var(--line);border-radius:50%;background:#211c11cc;color:var(--ivory);font-size:1.8rem;cursor:pointer;transform:translateY(-50%)}
.lightbox-nav:hover,.lightbox-nav:focus-visible{border-color:var(--gold);color:var(--gold)}
.lightbox-prev{left:0}.lightbox-next{right:0}
.lightbox-bottom{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.lightbox-bottom .lightbox-action{min-width:120px;color:var(--ink);background:var(--gold);border-color:var(--gold);font-weight:700}
/* Keep the utility layer visible above each control's existing background rules. */
.wipe-fill{background:var(--wipe-base)!important}.wipe-fill[aria-pressed="true"],.wipe-fill[aria-selected="true"]{background:var(--gold)!important}
/* Fix: component colors (.back-link gold, .group-picker ivory, lightbox/sheet buttons) were beating the wipe text color,
   giving gold-on-gold or low-contrast text. Filled buttons always use the dark rest color; selected items use dark ink. */
.wipe-fill:not(.wipe-fill--inverse),.wipe-fill:not(.wipe-fill--inverse) strong,.wipe-fill:not(.wipe-fill--inverse) span{color:var(--wipe-text-rest)}
.wipe-fill:not(.wipe-fill--inverse):focus-visible,.wipe-fill:not(.wipe-fill--inverse):focus-visible strong,.wipe-fill:not(.wipe-fill--inverse):focus-visible span{color:var(--wipe-text-hover)}
@media (hover:hover){.wipe-fill:not(.wipe-fill--inverse):hover,.wipe-fill:not(.wipe-fill--inverse):hover strong,.wipe-fill:not(.wipe-fill--inverse):hover span{color:var(--wipe-text-hover)}}
.wipe-fill[aria-pressed="true"],.wipe-fill[aria-selected="true"],.wipe-fill[aria-pressed="true"] strong,.wipe-fill[aria-selected="true"] strong,.wipe-fill[aria-selected="true"] span{color:#14110a!important}
@media (hover:none) and (pointer:coarse){.lightbox-nav{display:none}}
@media (min-width:600px){.photo-grid{columns:3 190px;column-gap:14px}.photo-card{margin-bottom:14px}.page{padding-left:24px;padding-right:24px}.control-deck{margin-left:-24px;margin-right:-24px;padding-left:24px;padding-right:24px}}
@media (min-width:1000px){.photo-grid{columns:4 210px}.control-deck{border-radius:0 0 14px 14px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}.photo-card{opacity:1;transform:none}.photo-card img{filter:none;animation:none}.photo-card:before{transform:none;opacity:0;transition:opacity 200ms ease}.photo-card:hover:before,.photo-card:focus-visible:before,.photo-card.on:before{opacity:1}.photo-card:hover,.photo-card:focus-visible,.photo-card.on{transform:none}.photo-card:hover img,.photo-card:focus-visible img,.photo-card.on img{transform:none}.photo-card.is-sample img,.photo-card.is-sample img.is-loaded,.photo-card.is-sample:hover img,.photo-card.is-sample:focus-visible img{filter:blur(2px) brightness(.8)}.coming-soon-badge,.coming-soon-badge:after{animation:none}.lightbox-image{filter:none;opacity:1}.lightbox{opacity:1}}
@media (max-width:639px){:root{--header-height:88px}.site-header{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;gap:4px 8px}.back-link{grid-row:1;grid-column:1;justify-self:start;padding-left:9px;padding-right:9px;font-size:.7rem}.header-title{grid-row:2;grid-column:1/-1;justify-self:center;font-size:.85rem}.language-toggle{grid-row:1;grid-column:2}.language-toggle button{padding-left:6px;padding-right:6px;font-size:.58rem}.categories{display:none}.group-picker{display:grid}}
</style>

<body>
<header class="site-header">
  <a class="back-link wipe-fill" id="back" href="index.html">← សំបុត្រអញ្ជើញ</a>
  <p class="header-title">អាល់ប៊ុមរូបភាព</p>
  <div class="language-toggle" id="languageToggle" role="group" aria-label="Language / ភាសា">
    <button class="wipe-fill wipe-fill--inverse" type="button" data-language="both" aria-pressed="true">ខ្មែរ · EN</button>
    <button class="wipe-fill wipe-fill--inverse" type="button" data-language="km" aria-pressed="false">ខ្មែរ</button>
    <button class="wipe-fill wipe-fill--inverse" type="button" data-language="en" aria-pressed="false">EN</button>
  </div>
</header>

<main class="page">
  <section class="hero" aria-labelledby="page-title">
    <p class="hero-kicker">Guest photo album</p>
    <h1 id="page-title">អាល់ប៊ុមរូបភាព</h1>
    <p class="names">Soem Kungkiet &amp; Chham Chanthu</p>
    <p class="hero-count" id="heroCount" aria-live="polite"></p>
    <div class="rule" aria-hidden="true"></div>
  </section>

  <section class="album-gallery-section">
    <div class="coming-soon-content">
      <section class="control-deck" aria-label="Album filters">
        <div class="segmented" id="sides" data-side="groom" role="group" aria-label="Choose album side">
          <span class="seg-indicator" aria-hidden="true"></span>
          <button class="wipe-fill wipe-fill--inverse" id="tGroom" type="button" data-side="groom" aria-pressed="true">ខាងកូនកំលោះ · Groom</button>
          <button class="wipe-fill wipe-fill--inverse" id="tBride" type="button" data-side="bride" aria-pressed="false">ខាងកូនក្រមុំ · Bride</button>
        </div>
        <div class="categories-wrap">
          <nav class="categories" id="categories" aria-label="Choose a photo category"></nav>
          <button class="group-picker wipe-fill" id="groupPicker" type="button" aria-haspopup="dialog" aria-expanded="false">
            <span class="group-picker-label">ជ្រើសរើសក្រុម · Choose group</span><strong id="pickerValue"></strong><span class="group-picker-chevron" aria-hidden="true">⌄</span>
          </button>
        </div>
      </section>

      <div class="gallery-meta"><strong id="galleryTitle">Groom · All</strong><span id="galleryCount"></span></div>
      <section class="photo-grid" id="photoGrid" aria-live="polite"></section>
      <p class="empty-state" id="empty" hidden>រូបភាពនឹងត្រូវបានបន្ថែមក្រោយពិធី<br><span>Photos will be added after the wedding.</span></p>
    </div>
  </section>
</main>
<footer class="site-footer">សូមអរគុណ · Thank you ♥</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <div class="lightbox-top">
    <button class="lightbox-action wipe-fill" id="closeLightbox" type="button" aria-label="បិទ · Close photo viewer">✕ <span>បិទ · Close</span></button>
    <span class="lightbox-counter" id="lightboxCounter">1 / 1</span>
    <span class="lightbox-spacer" aria-hidden="true"></span>
  </div>
  <div class="lightbox-stage" id="lightboxStage">
    <button class="lightbox-nav wipe-fill" id="previousPhoto" type="button" aria-label="រូបមុន · Previous photo">‹</button>
    <img class="lightbox-image" id="lightboxImage" alt="" draggable="false">
    <button class="lightbox-nav wipe-fill" id="nextPhoto" type="button" aria-label="រូបបន្ទាប់ · Next photo">›</button>
  </div>
  <div class="lightbox-bottom"><a class="lightbox-action wipe-fill" id="downloadPhoto" download>⬇ រក្សាទុក · Save</a><button class="lightbox-action wipe-fill" id="sharePhoto" type="button">↗ ចែករំលែក · Share</button><button class="lightbox-action wipe-fill" id="zoomPhoto" type="button">＋ ពង្រីក · Zoom</button></div>
</div>

<div class="sheet-backdrop" id="groupSheet" hidden>
  <section class="group-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-heading"><h2 id="sheetTitle">ជ្រើសរើសក្រុម · Choose group</h2><button class="sheet-close wipe-fill" id="closeSheet" type="button" aria-label="បិទ · Close">✕</button></div>
    <div class="sheet-options" id="sheetOptions" role="listbox"></div>
  </section>
</div>

<script src="js/config.js"></script>
<script src="js/coming-soon.js"></script>
<script>
/* DATA: one bilingual source of truth for both album sides. */
// Controlled by ALBUM_COMING_SOON in js/config.js: true = photos stay blurred with a Coming Soon badge, false = open album.
const SHOW_COMING_SOON=typeof CONFIG!=='undefined'&&CONFIG.ALBUM_COMING_SOON===true;
const makePhotos=group=>{
  const paths=group.list&&group.list.length?group.list:Array.from({length:group.count||0},(_,index)=>(group.folder||'')+(index+1)+'.jpg');
  return paths.map((path,index)=>{
    const source=typeof path==='string'?{src:path}:path;
    return{src:source.src,thumb:'assets/album-placeholder.svg',w:source.w||720,h:source.h||960,alt:source.alt||group.km+' · '+group.en+' · រូបភាព '+(index+1)+' · Photo '+(index+1),isReal:source.isReal===true};
  });
};
const albums={
  groom:{label:['ខាងកូនកំលោះ','Groom'],groups:(CONFIG.album.groom.categories||[]).map(group=>({id:group.id,kh:group.km,en:group.en,photos:makePhotos(group)}))},
  bride:{label:['ខាងកូនក្រមុំ','Bride'],groups:(CONFIG.album.bride.categories||[]).map(group=>({id:group.id,kh:group.km,en:group.en,photos:makePhotos(group)}))}
};

/* SCRIPT */
(() => {
  const $=id=>document.getElementById(id);
  const sideButtons=[$('tGroom'),$('tBride')];
  let side='groom',category='all',photos=[],viewerPhotos=[],viewerIndex=0,viewerFrom=null,swipeX=0,swipeY=0,panX=0,panY=0,panStartX=0,panStartY=0,pinchDistance=0,zoom=1,pinching=false,dragging=false,uiLanguage='both',sheetFocus=null,sheetStartY=0;
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const listFor=group=>group?group.photos||[]:[];
  const entriesFor=group=>listFor(group).map(photo=>({photo,group}));
  const isSamplePhoto=photo=>SHOW_COMING_SOON&&photo.isReal!==true;
  const realPhotoCount=group=>listFor(group).filter(photo=>!isSamplePhoto(photo)).length;
  const comingSoonLabel=()=>uiLanguage==='km'?'ឆាប់ៗនេះ':uiLanguage==='en'?'Coming Soon':'ឆាប់ៗនេះ · Coming Soon';
  const groups=()=>albums[side].groups||[];
  const availableGroups=()=>groups().filter(group=>group.photos&&group.photos.length);
  const allPhotos=()=>availableGroups().flatMap(entriesFor);
  const setHash=()=>history.replaceState(null,'',location.pathname+location.search+'#'+side+(category==='all'?'':'/'+category));
  const displayName=group=>{if(!group)return uiLanguage==='km'?'ទាំងអស់':uiLanguage==='en'?'All':'ទាំងអស់ · All';return uiLanguage==='km'?group.kh:uiLanguage==='en'?group.en:group.kh+' · '+group.en};
  const chipMarkup=group=>'<span class="category-km">'+(uiLanguage==='en'?group.en:group.kh)+'</span><span class="category-en">'+(uiLanguage==='km'?'':uiLanguage==='en'?'':group.en)+'</span>'+(realPhotoCount(group)?'<small>'+realPhotoCount(group)+'</small>':'');

  function renderCategories(){
    const nav=$('categories');nav.innerHTML='';const available=availableGroups();
    const allCount=available.reduce((total,group)=>total+realPhotoCount(group),0),all=document.createElement('button');all.className='category-chip wipe-fill wipe-fill--inverse';all.type='button';all.dataset.category='all';all.setAttribute('aria-pressed',category==='all');all.innerHTML='<span class="category-km">'+(uiLanguage==='en'?'All':'ទាំងអស់')+'</span><span class="category-en">'+(uiLanguage==='both'?'All':'')+'</span>'+(allCount?'<small>'+allCount+'</small>':'');all.onclick=()=>selectCategory('all');nav.appendChild(all);
    available.forEach(group=>{const chip=document.createElement('button');chip.className='category-chip wipe-fill wipe-fill--inverse';chip.type='button';chip.dataset.category=group.id;chip.setAttribute('aria-pressed',category===group.id);chip.title=group.en;chip.innerHTML=chipMarkup(group);chip.onclick=()=>selectCategory(group.id);nav.appendChild(chip)});
    const sheet=$('sheetOptions');sheet.innerHTML='';const sheetGroups=[null,...available];sheetGroups.forEach(group=>{const option=document.createElement('button');option.className='sheet-option wipe-fill wipe-fill--inverse';option.type='button';option.dataset.category=group?group.id:'all';option.setAttribute('role','option');option.setAttribute('aria-selected',String(group?category===group.id:category==='all'));const count=group?realPhotoCount(group):allCount;option.innerHTML='<span class="sheet-km">'+(group?group.kh:'ទាំងអស់')+'</span><span class="sheet-en">'+(group?group.en:'All')+'</span>'+(count?'<small>'+count+'</small>':'')+'<span class="check" aria-hidden="true">✓</span>';option.onclick=()=>selectCategory(group?group.id:'all');sheet.appendChild(option)});
    $('pickerValue').textContent=displayName(category==='all'?null:available.find(group=>group.id===category));
    const active=nav.querySelector('[aria-pressed="true"]');if(active&&window.matchMedia('(max-width:700px)').matches)active.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'nearest',inline:'center'});
  }

  function renderGrid(){
    const grid=$('photoGrid');grid.innerHTML='';photos=category==='all'?allPhotos():entriesFor(groups().find(group=>group.id===category));
    viewerPhotos=photos.filter(entry=>!isSamplePhoto(entry.photo));
    if(!photos.length){$('empty').hidden=false;return}$('empty').hidden=true;
    photos.forEach((entry,index)=>{
      const photo=entry.photo,group=entry.group,sample=isSamplePhoto(photo),card=document.createElement('button');
      card.className='photo-card'+(sample?' is-sample':'');card.type='button';card.disabled=sample;card.tabIndex=sample?-1:0;
      card.style.setProperty('--delay',reduceMotion?'0ms':Math.min(index*35,420)+'ms');
      const image=document.createElement('img');image.src=photo.thumb||photo.src;image.alt=photo.alt;image.width=photo.w;image.height=photo.h;image.loading='lazy';image.decoding='async';
      image.addEventListener('load',()=>{image.classList.add('is-loaded');card.classList.add('is-ready')},{once:true});image.addEventListener('error',()=>{card.remove()},{once:true});
      const caption=document.createElement('span');caption.className='photo-caption';caption.innerHTML='<span class="heart" aria-hidden="true">♥</span><span><span class="caption-kh">'+group.kh+'</span><span class="caption-en">'+group.en+'</span></span>';
      card.appendChild(image);card.appendChild(caption);
      if(sample){
        card.setAttribute('aria-label',comingSoonLabel());
        const overlay=document.createElement('span');overlay.className='sample-overlay';overlay.setAttribute('aria-hidden','true');
        const badge=document.createElement('span');badge.className='coming-soon-badge';
        if(uiLanguage!=='en'){const khmer=document.createElement('span');khmer.className='coming-soon-kh';khmer.textContent='ឆាប់ៗនេះ';badge.appendChild(khmer)}
        if(uiLanguage!=='km'){const english=document.createElement('span');english.className='coming-soon-en';english.textContent='Coming Soon';badge.appendChild(english)}
        const icon=document.createElement('span');icon.className='coming-soon-icon';icon.textContent='✦';icon.setAttribute('aria-hidden','true');badge.appendChild(icon);
        overlay.appendChild(badge);card.appendChild(overlay);
      }else{
        card.onclick=event=>{if(window.matchMedia('(hover: none)').matches&&event.detail>0){if(!card.classList.contains('on')){document.querySelectorAll('.photo-card.on').forEach(active=>active.classList.remove('on'));card.classList.add('on');return}}openViewer(index)};
      }
      grid.appendChild(card);if(image.complete)image.dispatchEvent(new Event('load'))
    });
  }

  function render(){
    const valid=category==='all'||groups().some(group=>group.id===category&&listFor(group).length);if(!valid)category='all';
    $('sides').dataset.side=side;sideButtons.forEach(button=>button.setAttribute('aria-pressed',button.dataset.side===side));
    renderCategories();renderGrid();const current=category==='all'?null:groups().find(group=>group.id===category);const count=photos.length,hasSamples=photos.some(entry=>isSamplePhoto(entry.photo));const sideLabel=side==='groom'?'ខាងកូនកំលោះ · Groom':'ខាងកូនក្រមុំ · Bride';$('heroCount').textContent=hasSamples?sideLabel+' album · '+comingSoonLabel():'រូបភាព '+count+' · '+count+' photos · '+sideLabel+' album';$('galleryTitle').textContent=sideLabel+' · '+displayName(current);$('galleryCount').textContent=hasSamples?comingSoonLabel():count+' photos';
  }

  function openSheet(){sheetFocus=document.activeElement;$('groupPicker').setAttribute('aria-expanded','true');$('groupSheet').hidden=false;requestAnimationFrame(()=>{$('groupSheet').classList.add('is-open');const selected=$('sheetOptions').querySelector('[aria-selected="true"]');if(selected)selected.focus()})}
  function closeSheet(){if($('groupSheet').hidden)return;$('groupSheet').classList.remove('is-open');$('groupSheet').hidden=true;$('groupPicker').setAttribute('aria-expanded','false');if(sheetFocus&&sheetFocus.focus)sheetFocus.focus();sheetFocus=null}
  function selectSide(next){side=next;category='all';closeSheet();closeViewer();setHash();render()}
  function selectCategory(next){category=next;closeSheet();closeViewer();setHash();render()}
  function applyTransform(){$('lightboxImage').style.transform='translate('+panX+'px,'+panY+'px) scale('+zoom+')'}
  function preload(index){if(!viewerPhotos.length)return;const image=new Image();image.src=viewerPhotos[(index+viewerPhotos.length)%viewerPhotos.length].photo.src}
  function showViewer(index,direction){if(!viewerPhotos.length)return;viewerIndex=(index+viewerPhotos.length)%viewerPhotos.length;const photo=viewerPhotos[viewerIndex].photo,image=$('lightboxImage');image.classList.remove('is-loaded','slide-left','slide-right');if(direction){void image.offsetWidth;image.classList.add(direction<0?'slide-left':'slide-right')}image.onload=()=>image.classList.add('is-loaded');image.src=photo.src;if(image.complete)image.classList.add('is-loaded');image.alt=photo.alt;$('lightboxCounter').textContent=(viewerIndex+1)+' / '+viewerPhotos.length;$('downloadPhoto').href=photo.src;$('downloadPhoto').download=photo.src.split('/').pop();preload(viewerIndex+1);preload(viewerIndex-1)}
  function rubberBand(direction){const stage=$('lightboxStage');stage.classList.remove('rubber-left','rubber-right');void stage.offsetWidth;stage.classList.add(direction<0?'rubber-left':'rubber-right')}
  function navigate(direction){if(zoom>1){rubberBand(direction);return}const next=viewerIndex+direction;if(next<0||next>=viewerPhotos.length){rubberBand(direction);return}showViewer(next,direction<0?-1:1)}
  function animateFromThumbnail(){if(reduceMotion||!viewerFrom)return;const image=$('lightboxImage'),origin=viewerFrom.getBoundingClientRect(),target=image.getBoundingClientRect();if(!target.width||!target.height)return;image.style.setProperty('--flip-x',origin.left+origin.width/2-(target.left+target.width/2)+'px');image.style.setProperty('--flip-y',origin.top+origin.height/2-(target.top+target.height/2)+'px');image.style.setProperty('--flip-sx',Math.max(.05,origin.width/target.width));image.style.setProperty('--flip-sy',Math.max(.05,origin.height/target.height));image.classList.remove('flip-in');void image.offsetWidth;image.classList.add('flip-in')}
  function openViewer(index){const viewerIndexForPhoto=viewerPhotos.indexOf(photos[index]);if(viewerIndexForPhoto<0)return;viewerFrom=document.activeElement;zoom=1;panX=0;panY=0;applyTransform();showViewer(viewerIndexForPhoto);$('lightbox').hidden=false;document.body.style.overflow='hidden';requestAnimationFrame(()=>{$('lightbox').classList.add('is-open');animateFromThumbnail()});$('closeLightbox').focus()}
  function closeViewer(){if($('lightbox').hidden)return;$('lightbox').classList.remove('is-open');$('lightbox').hidden=true;document.body.style.overflow='';zoom=1;panX=0;panY=0;if(viewerFrom&&viewerFrom.focus)viewerFrom.focus();viewerFrom=null}
  function distance(touches){return Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY)}
  function changeZoom(next){zoom=Math.max(1,Math.min(3,next));if(zoom===1){panX=0;panY=0}applyTransform()}
  async function sharePhoto(){if(!viewerPhotos.length)return;const url=new URL(viewerPhotos[viewerIndex].photo.src,location.href).href;try{if(navigator.share){await navigator.share({title:'Soem Kungkiet & Chham Chanthu',text:'Wedding photo · រូបភាពអាពាហ៍ពិពាហ៍',url});return}if(navigator.clipboard&&navigator.clipboard.writeText)await navigator.clipboard.writeText(url);else{const input=document.createElement('textarea');input.value=url;input.setAttribute('readonly','');input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();if(!document.execCommand('copy'))throw new Error('Copy failed');input.remove()}$('sharePhoto').textContent='✓ បានចម្លង · Copied'}catch(error){if(error.name!=='AbortError')$('sharePhoto').textContent='មិនអាចចែករំលែក · Try again';setTimeout(()=>$('sharePhoto').textContent='↗ ចែករំលែក · Share',1800)}}

  sideButtons.forEach(button=>button.onclick=()=>selectSide(button.dataset.side));
  $('groupPicker').onclick=openSheet;$('closeSheet').onclick=closeSheet;$('groupSheet').onclick=event=>{if(event.target===$('groupSheet'))closeSheet()};
  $('groupSheet').addEventListener('touchstart',event=>{sheetStartY=event.touches[0].clientY},{passive:true});
  $('groupSheet').addEventListener('touchend',event=>{if(event.changedTouches[0].clientY-sheetStartY>60)closeSheet()},{passive:true});
  $('languageToggle').querySelectorAll('button').forEach(button=>button.onclick=()=>{uiLanguage=button.dataset.language;$('languageToggle').querySelectorAll('button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));if(window.updateComingSoonLanguage)window.updateComingSoonLanguage(uiLanguage);render()});
  $('back').href='index.html'+location.search;
  $('closeLightbox').onclick=closeViewer;$('previousPhoto').onclick=()=>navigate(-1);$('nextPhoto').onclick=()=>navigate(1);$('zoomPhoto').onclick=()=>changeZoom(zoom===1?2:1);$('sharePhoto').onclick=sharePhoto;
  $('lightbox').onclick=event=>{if(event.target===$('lightbox'))closeViewer()};
  $('lightboxImage').addEventListener('touchstart',event=>{if(event.touches.length===2){pinching=true;dragging=false;pinchDistance=distance(event.touches);return}swipeX=event.touches[0].clientX;swipeY=event.touches[0].clientY;if(zoom>1){dragging=true;panStartX=panX;panStartY=panY}},{passive:true});
  $('lightboxImage').addEventListener('touchmove',event=>{if(pinching&&event.touches.length===2){changeZoom(zoom*distance(event.touches)/pinchDistance);pinchDistance=distance(event.touches);event.preventDefault();return}if(dragging&&zoom>1){panX=panStartX+event.touches[0].clientX-swipeX;panY=panStartY+event.touches[0].clientY-swipeY;applyTransform();event.preventDefault()}},{passive:false});
  $('lightboxImage').addEventListener('touchend',event=>{if(pinching){if(event.touches.length<2)pinching=false;return}const dx=event.changedTouches[0].clientX-swipeX,dy=event.changedTouches[0].clientY-swipeY;dragging=false;if(zoom>1)return;if(dy>80&&Math.abs(dy)>Math.abs(dx)){closeViewer();return}if(Math.abs(dx)>45)navigate(dx<0?1:-1)},{passive:true});
  $('lightboxImage').ondblclick=()=>changeZoom(zoom===1?2:1);
  document.addEventListener('keydown',event=>{if(!$('groupSheet').hidden){if(event.key==='Escape'){event.preventDefault();closeSheet();return}if(event.key==='Tab'){const focusable=[$('closeSheet'),...$('sheetOptions').querySelectorAll('button')],current=focusable.indexOf(document.activeElement);event.preventDefault();focusable[(current+(event.shiftKey?focusable.length-1:1))%focusable.length].focus()}return}if($('lightbox').hidden)return;if(event.key==='Escape'){event.preventDefault();closeViewer();return}if(event.key==='ArrowRight'){event.preventDefault();navigate(1)}if(event.key==='ArrowLeft'){event.preventDefault();navigate(-1)}if(event.key==='Tab'){const focusable=[$('closeLightbox'),$('previousPhoto'),$('nextPhoto'),$('downloadPhoto'),$('sharePhoto'),$('zoomPhoto')].filter(element=>getComputedStyle(element).display!=='none'),current=focusable.indexOf(document.activeElement);event.preventDefault();focusable[(current+(event.shiftKey?focusable.length-1:1))%focusable.length].focus()}});
  function readHash(){const hash=location.hash.slice(1).split('/'),requested=hash[1]||'all';side=hash[0]==='bride'?'bride':'groom';category=requested;render();if(requested!==category)setHash()}
  readHash();window.addEventListener('hashchange',()=>{closeViewer();readHash()});
})();
</script>
