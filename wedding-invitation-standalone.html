<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#231E0E">
  <meta name="description" content="សិរីមង្គលអាពាហ៍ពិពាហ៍ · Soem Kungkiet & Chham Chanthu">
  <title>សិរីមង្គលអាពាហ៍ពិពាហ៍ · Soem Kungkiet &amp; Chham Chanthu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Kantumruy+Pro:wght@400;500;600;700&family=Moul&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --night: #231E0E;
      --night-soft: #2A2410;
      --gold: #B59B34;
      --gold-light: #E8D28A;
      --gold-deep: #8F7524;
      --cream: #F3EAD0;
      --khmer: "Kantumruy Pro", "Noto Serif Khmer", "Battambang", sans-serif;
      --display: "Alfa Slab One", "Cormorant Garamond", Georgia, serif;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      position: relative;
      display: grid;
      min-height: 100svh;
      margin: 0;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 12%, rgba(138, 122, 60, .28), transparent 38%),
        radial-gradient(ellipse at 50% 78%, rgba(138, 122, 60, .13), transparent 40%),
        linear-gradient(155deg, var(--night-soft), var(--night) 58%, #1d190c);
      color: var(--cream);
      font-family: var(--khmer);
      -webkit-font-smoothing: antialiased;
    }

    .ambience {
      position: fixed;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .sparkle {
      position: absolute;
      top: 8%;
      left: max(7%, calc(50% - 190px));
      width: 15px;
      height: 15px;
      color: var(--gold-light);
      opacity: .3;
      animation: twinkle 3s ease-in-out infinite;
    }

    .sparkle:nth-child(2) { top: 17%; left: max(17%, calc(50% - 155px)); width: 9px; animation-delay: -1.2s; }
    .sparkle:nth-child(3) { top: 11%; left: min(83%, calc(50% + 150px)); width: 12px; animation-delay: -2.1s; }

    .petal {
      position: absolute;
      top: -34px;
      width: 17px;
      height: 24px;
      color: var(--gold-light);
      opacity: .17;
      animation: drift-down var(--duration, 18s) linear var(--delay, 0s) infinite;
    }

    .petal:nth-of-type(4) { left: 12%; --duration: 19s; --delay: -8s; }
    .petal:nth-of-type(5) { left: 30%; width: 13px; --duration: 24s; --delay: -16s; }
    .petal:nth-of-type(6) { left: 68%; width: 14px; --duration: 21s; --delay: -11s; }
    .petal:nth-of-type(7) { left: 87%; --duration: 26s; --delay: -4s; }

    .invitation {
      position: relative;
      z-index: 1;
      width: min(100%, 410px);
      padding: clamp(29px, 8vw, 42px) clamp(20px, 6vw, 34px) 25px;
      overflow: hidden;
      border: 1.5px solid rgba(181, 155, 52, .9);
      border-radius: 25px;
      background:
        radial-gradient(ellipse at 50% 25%, rgba(138, 122, 60, .19), transparent 58%),
        linear-gradient(155deg, rgba(42, 36, 16, .97), rgba(35, 30, 14, .98));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .48), 0 0 54px rgba(138, 122, 60, .13);
      text-align: center;
      opacity: 0;
      transform: translateY(18px);
      animation: card-arrive 600ms ease-out 80ms forwards;
    }

    .invitation::before {
      position: absolute;
      inset: 11px;
      border: 1px dashed rgba(232, 210, 138, .25);
      border-radius: 17px;
      content: "";
      pointer-events: none;
    }

    .invitation::after {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 20%, rgba(232, 210, 138, .045), transparent 65%);
      content: "";
      pointer-events: none;
    }

    .content { position: relative; z-index: 1; }

    .heart-badge,
    .title,
    .divider,
    .person,
    .ampersand,
    .date,
    .countdown,
    .lotus {
      opacity: 0;
      animation: item-arrive 550ms ease-out forwards;
    }

    .heart-badge { animation-delay: 180ms; }
    .title { animation-delay: 280ms; }
    .divider { animation-delay: 360ms; }
    .person--groom { animation-delay: 440ms; }
    .ampersand { animation-delay: 500ms; }
    .person--bride { animation-delay: 560ms; }
    .date { animation-delay: 640ms; }
    .countdown { animation-delay: 720ms; }
    .lotus { animation-delay: 800ms; }

    .heart-badge {
      display: grid;
      width: 90px;
      height: 90px;
      margin: 0 auto 21px;
      place-items: center;
      border: 1px solid rgba(243, 234, 208, .46);
      border-radius: 50%;
      background: radial-gradient(circle at 34% 26%, #d2b64b, var(--gold) 55%, var(--gold-deep));
      box-shadow: 0 0 0 5px rgba(181, 155, 52, .1), 0 9px 28px rgba(0, 0, 0, .32), inset 0 1px 5px rgba(255, 246, 204, .34);
    }

    .heart-badge svg { width: 35px; height: 35px; fill: none; stroke: #fffaf0; stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; }

    h1 {
      margin: 0;
      color: var(--gold-light);
      font: 400 clamp(1.25rem, 5.3vw, 1.55rem)/1.7 "Moul", var(--khmer);
      text-shadow: 0 2px 18px rgba(232, 210, 138, .12);
      text-wrap: balance;
    }

    .divider {
      display: flex;
      width: min(210px, 72%);
      height: 14px;
      margin: 11px auto 19px;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .divider::before, .divider::after { width: 74px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); content: ""; }
    .divider::after { transform: scaleX(-1); }
    .divider i { width: 7px; height: 7px; transform: rotate(45deg); border: 1px solid var(--gold-light); }

    .person { margin: 0; }
    .role { margin: 0 0 3px; color: rgba(243, 234, 208, .75); font-size: .82rem; letter-spacing: .13em; }
    .role-en { margin-left: 5px; font: 500 .88rem/1 "Cormorant Garamond", Georgia, serif; letter-spacing: .08em; }
    .name {
      margin: 0;
      color: var(--gold-light);
      font: 400 clamp(1.48rem, 6.7vw, 1.9rem)/1.3 var(--display), Georgia, serif;
      letter-spacing: .5px;
      text-shadow: 0 2px 16px rgba(232, 210, 138, .12);
      text-wrap: balance;
    }

    .ampersand { margin: 2px 0 0; color: var(--gold); font: italic 500 2rem/.95 "Cormorant Garamond", Georgia, serif; }

    .date { margin: 17px 0 0; color: var(--cream); font-size: .94rem; line-height: 1.85; }
    .date-en { display: block; color: rgba(243, 234, 208, .7); font: 500 .92rem/1.5 "Cormorant Garamond", Georgia, serif; letter-spacing: .06em; }

    .countdown { margin: 19px 0 0; }
    .countdown-title { margin: 0 0 10px; color: rgba(243, 234, 208, .9); font-size: .82rem; }
    .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }

    .tile {
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(243, 234, 208, .26);
      border-radius: 12px;
      background: linear-gradient(150deg, #c0a640, var(--gold) 56%, #9a8128);
      color: #fffaf0;
      box-shadow: 0 5px 14px rgba(0, 0, 0, .23), inset 0 1px 0 rgba(255, 250, 226, .22);
    }

    .number {
      position: relative;
      display: grid;
      min-height: 49px;
      place-items: center;
      font: 600 clamp(1.35rem, 6vw, 1.65rem)/1 "Cormorant Garamond", Georgia, serif;
      font-variant-numeric: oldstyle-nums;
      text-shadow: 0 1px 2px rgba(40, 31, 8, .25);
    }

    .number::after { position: absolute; right: 7px; bottom: 0; left: 7px; height: 1px; background: rgba(71, 57, 14, .43); box-shadow: 0 1px rgba(255, 247, 215, .12); content: ""; }
    .number.tick { animation: number-tick 250ms ease-out; }
    .unit { display: block; padding: 5px 2px 6px; color: rgba(255, 250, 240, .95); font-size: .66rem; line-height: 1.2; }

    .lotus { display: block; width: min(170px, 55vw); margin: 20px auto 0; overflow: visible; }
    .lotus path { fill: none; stroke: url(#lotus-gold); stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
    .lotus .petal-line { filter: drop-shadow(0 0 3px rgba(232, 210, 138, .17)); }

    @keyframes card-arrive { to { opacity: 1; transform: translateY(0); } }
    @keyframes item-arrive { to { opacity: 1; } }
    @keyframes twinkle { 0%, 100% { opacity: .3; transform: scale(.75) rotate(0); } 50% { opacity: 1; transform: scale(1.06) rotate(45deg); } }
    @keyframes drift-down { from { transform: translate3d(0, -5vh, 0) rotate(-18deg); } to { transform: translate3d(24px, 112vh, 0) rotate(260deg); } }
    @keyframes number-tick { 0% { opacity: .45; transform: translateY(4px); } 100% { opacity: 1; transform: translateY(0); } }

    @media (max-width: 360px) {
      body { padding-right: 12px; padding-left: 12px; }
      .invitation { padding: 25px 17px 21px; }
      .tiles { gap: 6px; }
      .unit { font-size: .61rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .invitation, .heart-badge, .title, .divider, .person, .ampersand, .date, .countdown, .lotus { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="ambience" aria-hidden="true">
    <svg class="sparkle" viewBox="0 0 20 20"><path d="M10 0 12.2 7.8 20 10l-7.8 2.2L10 20l-2.2-7.8L0 10l7.8-2.2z" fill="currentColor"/></svg>
    <svg class="sparkle" viewBox="0 0 20 20"><path d="M10 0 12.2 7.8 20 10l-7.8 2.2L10 20l-2.2-7.8L0 10l7.8-2.2z" fill="currentColor"/></svg>
    <svg class="sparkle" viewBox="0 0 20 20"><path d="M10 0 12.2 7.8 20 10l-7.8 2.2L10 20l-2.2-7.8L0 10l7.8-2.2z" fill="currentColor"/></svg>
    <svg class="petal" viewBox="0 0 24 32"><path d="M12 2C22 8 24 18 12 30 1 19 2 9 12 2Z" fill="currentColor"/><path d="M12 7c0 8 0 14 0 20" fill="none" stroke="#8F7524" stroke-width=".8"/></svg>
    <svg class="petal" viewBox="0 0 24 32"><path d="M12 2C22 8 24 18 12 30 1 19 2 9 12 2Z" fill="currentColor"/><path d="M12 7c0 8 0 14 0 20" fill="none" stroke="#8F7524" stroke-width=".8"/></svg>
    <svg class="petal" viewBox="0 0 24 32"><path d="M12 2C22 8 24 18 12 30 1 19 2 9 12 2Z" fill="currentColor"/><path d="M12 7c0 8 0 14 0 20" fill="none" stroke="#8F7524" stroke-width=".8"/></svg>
    <svg class="petal" viewBox="0 0 24 32"><path d="M12 2C22 8 24 18 12 30 1 19 2 9 12 2Z" fill="currentColor"/><path d="M12 7c0 8 0 14 0 20" fill="none" stroke="#8F7524" stroke-width=".8"/></svg>
  </div>

  <main class="invitation" aria-labelledby="invitation-title">
    <div class="content">
      <div class="heart-badge" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M16 27S4.5 19.8 4.5 11.8A6.2 6.2 0 0 1 16 8.3a6.2 6.2 0 0 1 11.5 3.5C27.5 19.8 16 27 16 27Z"/></svg>
      </div>

      <h1 class="title" id="invitation-title">សិរីមង្គលអាពាហ៍ពិពាហ៍</h1>
      <div class="divider" aria-hidden="true"><i></i></div>

      <section class="person person--groom" aria-label="Groom">
        <p class="role">កូនកំលោះ <span class="role-en">· Groom</span></p>
        <h2 class="name">Soem Kungkiet</h2>
      </section>

      <p class="ampersand" aria-hidden="true">&amp;</p>

      <section class="person person--bride" aria-label="Bride">
        <p class="role">កូនក្រមុំ <span class="role-en">· Bride</span></p>
        <h2 class="name">Chham Chanthu</h2>
      </section>

      <p class="date">
        ថ្ងៃអាទិត្យ ទី២២ ខែវិច្ឆិកា ឆ្នាំ២០២៦ · ម៉ោង ៣:០០ រសៀល
        <span class="date-en">Sunday, 22 November 2026 · 3:00 PM</span>
      </p>

      <section class="countdown" aria-label="Wedding countdown">
        <p class="countdown-title">រាប់ថយក្រោយដល់ថ្ងៃមង្គលការ <span class="role-en">· Countdown</span></p>
        <div class="tiles">
          <div class="tile"><span class="number" id="days">00</span><span class="unit">ថ្ងៃ · Days</span></div>
          <div class="tile"><span class="number" id="hours">00</span><span class="unit">ម៉ោង · Hours</span></div>
          <div class="tile"><span class="number" id="minutes">00</span><span class="unit">នាទី · Minutes</span></div>
          <div class="tile"><span class="number" id="seconds">00</span><span class="unit">វិនាទី · Seconds</span></div>
        </div>
      </section>

      <svg class="lotus" viewBox="0 0 160 92" role="img" aria-label="Gold lotus">
        <defs>
          <linearGradient id="lotus-gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#E8D28A"/>
            <stop offset=".52" stop-color="#B59B34"/>
            <stop offset="1" stop-color="#8F7524"/>
          </linearGradient>
        </defs>
        <g class="petal-line">
          <path d="M80 8C66 28 66 54 80 72C94 54 94 28 80 8Z"/>
          <path d="M80 72C58 66 40 48 38 24C58 28 72 46 80 72Z"/>
          <path d="M80 72C102 66 120 48 122 24C102 28 88 46 80 72Z"/>
          <path d="M80 72C52 74 22 62 12 40C36 40 62 52 80 72Z"/>
          <path d="M80 72C108 74 138 62 148 40C124 40 98 52 80 72Z"/>
          <path d="M34 82Q80 94 126 82"/>
        </g>
      </svg>
    </div>
  </main>

  <script>
    (function () {
      "use strict";
      var target = Date.UTC(2026, 10, 22, 8, 0, 0);
      var fields = {
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds")
      };
      var previous = {};

      function updateCountdown() {
        var remaining = Math.max(0, target - Date.now());
        var totalSeconds = Math.floor(remaining / 1000);
        var values = {
          days: Math.floor(totalSeconds / 86400),
          hours: Math.floor(totalSeconds % 86400 / 3600),
          minutes: Math.floor(totalSeconds % 3600 / 60),
          seconds: totalSeconds % 60
        };

        Object.keys(fields).forEach(function (key) {
          var value = String(values[key]).padStart(2, "0");
          var field = fields[key];
          if (field.textContent !== value) {
            field.textContent = value;
            if (previous[key] !== undefined) {
              field.classList.remove("tick");
              void field.offsetWidth;
              field.classList.add("tick");
            }
            previous[key] = value;
          }
        });
      }

      updateCountdown();
      window.setInterval(updateCountdown, 1000);
    }());
  </script>
</body>
</html>
